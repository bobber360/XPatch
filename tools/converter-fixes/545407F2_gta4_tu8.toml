[[patch]]
    name = "Resolution 1120x630 (console, early patching required)"
    desc = "Made for a real Xbox 360: renders at 1120x630 instead of 1280x720 (close to the PS3 version), the console scales it to the TV output. Fewer GPU dips, sharper than 540p. Needs early patching ON in XPatch360's Settings, otherwise it has no effect. Use only one resolution patch."
    author = "bobber360 & Claude"
    is_enabled = false

    [[patch.be32]]
        address = 0x828c0bec
        value = 0x39600460 # grcDevice init: width = 1120 (instead of the "width" startup parameter, 1280)
    [[patch.be32]]
        address = 0x828c0bf0
        value = 0x48000018 # b -> store width
    [[patch.be32]]
        address = 0x828c0c0c
        value = 0x39200276 # height = 630 (instead of "height", 720)
    [[patch.be32]]
        address = 0x828c0c10
        value = 0x48000018 # b -> store height

[[patch]]
    name = "Resolution 960x540 (console, early patching required)"
    desc = "Made for a real Xbox 360: renders at 960x540 instead of 1280x720, the console scales it to the TV output. The biggest FPS gain (often 40-60 FPS unlocked), but a softer image. Needs early patching ON in XPatch360's Settings, otherwise it has no effect. Use only one resolution patch."
    author = "bobber360 & Claude"
    is_enabled = false

    [[patch.be32]]
        address = 0x828c0bec
        value = 0x396003c0 # grcDevice init: width = 960
    [[patch.be32]]
        address = 0x828c0bf0
        value = 0x48000018 # b -> store width
    [[patch.be32]]
        address = 0x828c0c0c
        value = 0x3920021c # height = 540
    [[patch.be32]]
        address = 0x828c0c10
        value = 0x48000018 # b -> store height

[[patch]]
    name = "Locked 30 FPS Frame Pacer (console)"
    desc = "Made for a real Xbox 360: frames go out at an even 30 FPS (one every 2 v-syncs, 33.4 ms) instead of 25-37 with uneven frame times. Where the game is slower it is not held back further (no drop to 20). Loading screens also run at 30. Don't use with Unlock FPS."
    author = "bobber360 & Claude"
    is_enabled = false

