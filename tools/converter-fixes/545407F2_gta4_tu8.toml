[[patch]]
    name = "Cheap Audio Effects (console)"
    desc = "Made for a real Xbox 360: turns on the game's own hidden -cheapaudioeffects option. Cheaper real-time audio effects and no audio occlusion, so a little less CPU work. Hardly audible."
    author = "bobber360 & Claude"
    is_enabled = false

    [[patch.be32]]
        address = 0x82902ad8
        value = 0x39600001 # audio init: cheap = 1
    [[patch.be8]]
        address = 0x831c6a77
        value = 0x01 # audio engine (831C6750) +807 = cheap flag, in case init already ran

[[patch]]
    name = "Disable Depth of Field (console)"
    desc = "Made for a real Xbox 360: turns off the distance blur (DOF). The Xenia 'Disable blur filter' patch has no effect on a console because the game reads this setting before the patch is applied; this one also writes the value itself."
    author = "bobber360 & Claude"
    is_enabled = false

    [[patch.be32]]
        address = 0x822ce278
        value = 0x908be904 # stw r4(=0) instead of the DOF multiplier (HD), for later timecycle reloads
    [[patch.be32]]
        address = 0x822ce2bc
        value = 0x908be904 # same (SD)
    [[patch.be32]]
        address = 0x82aa9e34
        value = 0x00000000 # DOF blur multiplier = 0 right away (was 0.5)

[[patch]]
    name = "Disable Warp Shadow (console)"
    desc = "Made for a real Xbox 360: skips one of the shadow passes, about +2-3 FPS in the city. Side effect: patchy, stale shadow spots on the ground and on car roofs (most other shadows stay). Best with the Frame Pacer."
    author = "bobber360 & Claude"
    is_enabled = false

    [[patch.be32]]
        address = 0x82524830
        value = 0x48000d28 # CRenderPhaseWarpShadow: beq -> b (skip building the shadow draw list)
